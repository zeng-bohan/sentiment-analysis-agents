name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Migration drift check
        run: |
          export DATABASE_URL="sqlite+aiosqlite:///./ci_migrations.db"
          alembic upgrade head
          alembic check
      - name: Run tests
        run: pytest tests -q
